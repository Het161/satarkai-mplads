<rect width="1280" height="700" fill="url(#ground)"/><ellipse cx="470" cy="380" rx="440" ry="300" fill="url(#glow)"/><text x="48" y="52" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">System architecture</text><text x="48" y="76" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#8A98B0">Four layers. The model service is the only one the platform can lose and keep working.</text><polygon points="371.27,576.10 519.36,661.60 519.36,682.50 371.27,597.00" fill="#443B7B" opacity="1.0"/><polygon points="618.09,604.60 519.36,661.60 519.36,682.50 618.09,625.50" fill="#594EA1" opacity="1.0"/><polygon points="470.00,519.10 618.09,604.60 519.36,661.60 371.27,576.10" fill="#7C6CE0" opacity="1.0"/><polygon points="470.00,519.10 618.09,604.60 519.36,661.60 371.27,576.10" fill="none" stroke="#AA9FEB" stroke-width="1" opacity="0.9"/><line x1="620" y1="605" x2="636" y2="605" stroke="#7C6CE0" stroke-width="1.4" opacity="0.8"/><circle cx="620" cy="605" r="3" fill="#7C6CE0"/><text x="644" y="597" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" letter-spacing="1">MODEL SERVICE<tspan font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="500" fill="#eb6834">   (optional)</tspan></text><text x="644" y="617" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#CBD9EC" opacity="0.95">FastAPI · scikit-learn · Python 3.13</text><text x="644" y="634" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#CBD9EC" opacity="0.95">IsolationForest anomaly score</text><text x="644" y="651" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#CBD9EC" opacity="0.95">Delay-risk prediction · ablation explanations</text><polygon points="371.27,458.10 519.36,543.60 519.36,564.50 371.27,479.00" fill="#0A1D3B" opacity="1.0"/><polygon points="618.09,486.60 519.36,543.60 519.36,564.50 618.09,507.50" fill="#0D264D" opacity="1.0"/><polygon points="470.00,401.10 618.09,486.60 519.36,543.60 371.27,458.10" fill="#12356B" opacity="1.0"/><polygon points="470.00,401.10 618.09,486.60 519.36,543.60 371.27,458.10" fill="none" stroke="#657C9F" stroke-width="1" opacity="0.9"/><line x1="620" y1="487" x2="636" y2="487" stroke="#12356B" stroke-width="1.4" opacity="0.8"/><circle cx="620" cy="487" r="3" fill="#12356B"/><text x="644" y="479" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" letter-spacing="1">DATA</text><text x="644" y="499" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#CBD9EC" opacity="0.95">PostgreSQL · Prisma</text><text x="644" y="516" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#CBD9EC" opacity="0.95">Works · Payments · Evidence · Alerts</text><text x="644" y="533" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#CBD9EC" opacity="0.95">AuditLog · DetectorOutcome (feedback loop)</text><polygon points="371.27,340.10 519.36,425.60 519.36,446.50 371.27,361.00" fill="#174276" opacity="1.0"/><polygon points="618.09,368.60 519.36,425.60 519.36,446.50 618.09,389.50" fill="#1E569A" opacity="1.0"/><polygon points="470.00,283.10 618.09,368.60 519.36,425.60 371.27,340.10" fill="#2a78d6" opacity="1.0"/><polygon points="470.00,283.10 618.09,368.60 519.36,425.60 371.27,340.10" fill="none" stroke="#75A7E4" stroke-width="1" opacity="0.9"/><line x1="620" y1="369" x2="636" y2="369" stroke="#2a78d6" stroke-width="1.4" opacity="0.8"/><circle cx="620" cy="369" r="3" fill="#2a78d6"/><text x="644" y="361" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" letter-spacing="1">APPLICATION</text><text x="644" y="381" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#CBD9EC" opacity="0.95">Next.js 14 · Server Components</text><text x="644" y="398" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#CBD9EC" opacity="0.95">scopeFor() jurisdiction filter on every query</text><text x="644" y="415" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#CBD9EC" opacity="0.95">Server actions · review workflow · exports</text><polygon points="371.27,222.10 519.36,307.60 519.36,328.50 371.27,243.00" fill="#0F6043" opacity="1.0"/><polygon points="618.09,250.60 519.36,307.60 519.36,328.50 618.09,271.50" fill="#137E58" opacity="1.0"/><polygon points="470.00,165.10 618.09,250.60 519.36,307.60 371.27,222.10" fill="#1baf7a" opacity="1.0"/><polygon points="470.00,165.10 618.09,250.60 519.36,307.60 371.27,222.10" fill="none" stroke="#6BCBA9" stroke-width="1" opacity="0.9"/><line x1="620" y1="251" x2="636" y2="251" stroke="#1baf7a" stroke-width="1.4" opacity="0.8"/><circle cx="620" cy="251" r="3" fill="#1baf7a"/><text x="644" y="243" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" letter-spacing="1">PRESENTATION</text><text x="644" y="263" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#CBD9EC" opacity="0.95">5 role dashboards · alert queue · drill-down</text><text x="644" y="280" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#CBD9EC" opacity="0.95">Audit trail · CSV and PDF export</text><text x="644" y="297" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#CBD9EC" opacity="0.95">English / हिन्दी · WCAG 2.1 AA</text><circle cx="470" cy="560" r="5" fill="#2a78d6" opacity="0.9"><animate attributeName="cy" values="560;156" dur="4.5s" begin="0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.95;0.95;0" dur="4.5s" begin="0s" repeatCount="indefinite"/></circle><circle cx="470" cy="560" r="5" fill="#2a78d6" opacity="0.9"><animate attributeName="cy" values="560;156" dur="4.5s" begin="1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.95;0.95;0" dur="4.5s" begin="1.5s" repeatCount="indefinite"/></circle><circle cx="470" cy="560" r="5" fill="#2a78d6" opacity="0.9"><animate attributeName="cy" values="560;156" dur="4.5s" begin="3.0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.95;0.95;0" dur="4.5s" begin="3.0s" repeatCount="indefinite"/></circle><g opacity="0.97"><rect x="48" y="452" width="300" height="106" rx="8" fill="#eb6834" fill-opacity="0.10" stroke="#eb6834" stroke-width="1.2" stroke-opacity="0.55"/><text x="68" y="478" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#eb6834" letter-spacing="1">ML_MODE=rules · THE DEFAULT</text><text x="68" y="500" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#D6E2F2">Unreachable or slow is treated as</text><text x="68" y="518" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#D6E2F2">&#8220;no model signals this run&#8221;, not an error.</text><text x="68" y="540" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#8A98B0">134 of 174 alerts need no Python at all.</text></g><g opacity="0.97"><rect x="48" y="580" width="300" height="86" rx="8" fill="#1baf7a" fill-opacity="0.10" stroke="#1baf7a" stroke-width="1.2" stroke-opacity="0.55"/><text x="68" y="606" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#1baf7a" letter-spacing="1">RBAC IS A QUERY FILTER</text><text x="68" y="628" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#D6E2F2">A missing jurisdiction yields DENY_ALL, so</text><text x="68" y="646" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#D6E2F2">the failure mode is &#8220;see nothing&#8221;, never all.</text></g></svg>