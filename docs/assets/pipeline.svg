<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 470" width="1280" height="470" role="img" aria-label="SatarkAI detection pipeline"><title>SatarkAI detection pipeline</title>
<defs>
  <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#0B1220"/>
    <stop offset="60%" stop-color="#0D1829"/>
    <stop offset="100%" stop-color="#0A101C"/>
  </linearGradient>
  <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#2a78d6" stop-opacity="0"/>
    <stop offset="50%" stop-color="#2a78d6" stop-opacity="0.55"/>
    <stop offset="100%" stop-color="#2a78d6" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="glow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#2a78d6" stop-opacity="0.30"/>
    <stop offset="100%" stop-color="#2a78d6" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowWarm" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#eb6834" stop-opacity="0.22"/>
    <stop offset="100%" stop-color="#eb6834" stop-opacity="0"/>
  </radialGradient>
</defs>
<rect width="1280" height="470" fill="url(#ground)"/><ellipse cx="640" cy="230" rx="560" ry="230" fill="url(#glow)"/><text x="48" y="50" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Detection pipeline</text><text x="48" y="74" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#8A98B0">Three layers of evidence, in order of how much each one needs. A human decides at the end of all of them.</text><polygon points="37.42,233.80 150.00,298.80 150.00,330.00 37.42,265.00" fill="#0A1D3B" opacity="1.0"/><polygon points="262.58,233.80 150.00,298.80 150.00,330.00 262.58,265.00" fill="#0D264D" opacity="1.0"/><polygon points="150.00,168.80 262.58,233.80 150.00,298.80 37.42,233.80" fill="#12356B" opacity="1.0"/><polygon points="150.00,168.80 262.58,233.80 150.00,298.80 37.42,233.80" fill="none" stroke="#657C9F" stroke-width="1" opacity="0.9"/><text x="150" y="216" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">eSAKSHI record</text><text x="150" y="238" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#D6E2F2" text-anchor="middle" opacity="0.92">968 works</text><text x="150" y="254" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#D6E2F2" text-anchor="middle" opacity="0.92">2,162 payments</text><text x="150" y="270" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#D6E2F2" text-anchor="middle" opacity="0.92">4,274 evidence files</text><line x1="268" y1="234" x2="412" y2="234" stroke="#415D89" stroke-width="2" opacity="0.45" stroke-dasharray="4 5"/><circle cx="268" cy="234" r="4.5" fill="#12356B"><animate attributeName="cx" values="268;412" dur="2.2s" begin="0.0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="2.2s" begin="0.0s" repeatCount="indefinite"/></circle><polygon points="307.42,233.80 420.00,298.80 420.00,330.00 307.42,265.00" fill="#174276" opacity="1.0"/><polygon points="532.58,233.80 420.00,298.80 420.00,330.00 532.58,265.00" fill="#1E569A" opacity="1.0"/><polygon points="420.00,168.80 532.58,233.80 420.00,298.80 307.42,233.80" fill="#2a78d6" opacity="1.0"/><polygon points="420.00,168.80 532.58,233.80 420.00,298.80 307.42,233.80" fill="none" stroke="#75A7E4" stroke-width="1" opacity="0.9"/><text x="420" y="216" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">8 rule detectors</text><text x="420" y="238" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#D6E2F2" text-anchor="middle" opacity="0.92">Deterministic · citable</text><text x="420" y="254" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#D6E2F2" text-anchor="middle" opacity="0.92">One scheme rule each</text><text x="420" y="270" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#D6E2F2" text-anchor="middle" opacity="0.92">No Python needed</text><line x1="538" y1="234" x2="682" y2="234" stroke="#5593DE" stroke-width="2" opacity="0.45" stroke-dasharray="4 5"/><circle cx="538" cy="234" r="4.5" fill="#2a78d6"><animate attributeName="cx" values="538;682" dur="2.2s" begin="0.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="2.2s" begin="0.5s" repeatCount="indefinite"/></circle><polygon points="577.42,233.80 690.00,298.80 690.00,330.00 577.42,265.00" fill="#0F6043" opacity="1.0"/><polygon points="802.58,233.80 690.00,298.80 690.00,330.00 802.58,265.00" fill="#137E58" opacity="1.0"/><polygon points="690.00,168.80 802.58,233.80 690.00,298.80 577.42,233.80" fill="#1baf7a" opacity="1.0"/><polygon points="690.00,168.80 802.58,233.80 690.00,298.80 577.42,233.80" fill="none" stroke="#6BCBA9" stroke-width="1" opacity="0.9"/><text x="690" y="216" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">2 statistical tests</text><text x="690" y="238" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#D6E2F2" text-anchor="middle" opacity="0.92">Cost outliers (MAD)</text><text x="690" y="254" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#D6E2F2" text-anchor="middle" opacity="0.92">Agency concentration</text><text x="690" y="270" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#D6E2F2" text-anchor="middle" opacity="0.92">Binomial tail test</text><line x1="808" y1="234" x2="952" y2="234" stroke="#49BF95" stroke-width="2" opacity="0.45" stroke-dasharray="4 5"/><circle cx="808" cy="234" r="4.5" fill="#1baf7a"><animate attributeName="cx" values="808;952" dur="2.2s" begin="1.0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="2.2s" begin="1.0s" repeatCount="indefinite"/></circle><polygon points="847.42,233.80 960.00,298.80 960.00,330.00 847.42,265.00" fill="#443B7B" opacity="1.0"/><polygon points="1072.58,233.80 960.00,298.80 960.00,330.00 1072.58,265.00" fill="#594EA1" opacity="1.0"/><polygon points="960.00,168.80 1072.58,233.80 960.00,298.80 847.42,233.80" fill="#7C6CE0" opacity="1.0"/><polygon points="960.00,168.80 1072.58,233.80 960.00,298.80 847.42,233.80" fill="none" stroke="#AA9FEB" stroke-width="1" opacity="0.9"/><text x="960" y="216" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">IsolationForest</text><text x="960" y="238" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#D6E2F2" text-anchor="middle" opacity="0.92">11 features</text><text x="960" y="254" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#D6E2F2" text-anchor="middle" opacity="0.92">Unusual in combination</text><text x="960" y="270" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#D6E2F2" text-anchor="middle" opacity="0.92">Needs the service</text><g><rect x="370" y="344" width="540" height="96" rx="10" fill="#0B1220" fill-opacity="0.85" stroke="#2a78d6" stroke-width="1.4" stroke-opacity="0.7"/><text x="640" y="376" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Explainable, ranked alert &#8212; then a human</text><text x="640" y="400" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#D6E2F2" text-anchor="middle">Plain-language reason &#183; the rule in words &#183; the records &#183; the score itemised</text><text x="640" y="422" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#E89B3C" text-anchor="middle" font-weight="600">Acknowledge &#183; Seek clarification &#183; Mark explained &#183; Escalate</text></g><line x1="640" y1="318" x2="420" y2="344" stroke="#22304A" stroke-width="1.5" opacity="0.45"/><line x1="640" y1="318" x2="860" y2="344" stroke="#22304A" stroke-width="1.5" opacity="0.45"/></svg>